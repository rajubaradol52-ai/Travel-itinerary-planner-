<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>✈️ Travel Itinerary Planner</h1>
        <p>Plan your trip easily and organize your activities.</p>
    </header>

    <main>
        <section class="planner">
            <h2>Add Travel Plan</h2>

            <input type="text" id="destination"
                   placeholder="Enter destination">

            <input type="date" id="travelDate">

            <input type="text" id="activity"
                   placeholder="Enter activity">

            <button onclick="addPlan()">Add Plan</button>
        </section>

        <section class="itinerary">
            <h2>My Itinerary</h2>
            <div class="budget">
    <h2>Trip Budget</h2>

    <input type="number" id="budget"
           placeholder="Enter your budget">

    <button onclick="showBudget()">Set Budget</button>

    <p id="budgetResult"></p>
</div>
            <div id="plans">
                <p class="empty">No travel plans added yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Travel Itinerary Planner</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
